<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Klarbase — impossible architecture</title>
<style>
  :root{
    --sky-top:#332f52;
    --sky-mid:#6b5878;
    --sky-low:#c98d6b;
    --ink:#efe6d8;
    --ink-dim:#a99e93;
    --panel:rgba(28,24,44,.82);
    --accent:#6fc4b8;
    --bad:#d97a72;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#241f38}
  body{
    font-family:ui-sans-serif,-apple-system,"Segoe UI",Inter,system-ui,sans-serif;
    color:var(--ink);
    background:linear-gradient(180deg,var(--sky-top) 0%,var(--sky-mid) 58%,var(--sky-low) 100%);
  }
  #stage{position:fixed;inset:0}
  canvas{display:block}

  .vignette{position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(ellipse at 50% 45%,transparent 40%,rgba(20,16,34,.55) 100%)}

  /* ---------- bottom bar ---------- */
  #bar{
    position:fixed;left:50%;bottom:18px;transform:translateX(-50%);
    display:flex;align-items:center;gap:14px;
    background:var(--panel);backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,.09);
    padding:9px 14px;border-radius:14px;
    font-size:12.5px;letter-spacing:.2px;
    box-shadow:0 10px 30px rgba(0,0,0,.35);
    opacity:0;transition:opacity .4s;pointer-events:none;
  }
  #bar.on{opacity:1;pointer-events:auto}
  .mode{font-weight:600;color:var(--accent);text-transform:lowercase}
  .sep{width:1px;height:20px;background:rgba(255,255,255,.13)}
  .keys{color:var(--ink-dim);display:flex;gap:12px;flex-wrap:wrap}
  .keys b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
  #palette{display:flex;gap:5px}
  .swatch{
    width:34px;height:30px;border-radius:8px;border:1px solid rgba(255,255,255,.14);
    display:flex;align-items:center;justify-content:center;font-size:10px;
    color:var(--ink-dim);cursor:pointer;background:rgba(255,255,255,.04);
    flex-direction:column;line-height:1.1;user-select:none;
  }
  .swatch b{font-size:9px;color:var(--ink)}
  .swatch.sel{border-color:var(--accent);color:var(--ink);background:rgba(111,196,184,.16)}

  #winflash{position:fixed;inset:0;pointer-events:none;z-index:15;opacity:0;
    background:radial-gradient(ellipse at 50% 55%,rgba(111,196,184,.5),rgba(111,196,184,0) 65%);
    transition:opacity 1.4s ease-out;}

  /* ---------- overlays ---------- */
  #start{
    position:fixed;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:26px;
    background:linear-gradient(180deg,rgba(30,26,48,.92),rgba(40,30,44,.88));
    backdrop-filter:blur(3px);z-index:20;transition:opacity .5s;
  }
  #start h1{margin:0;font-size:30px;font-weight:600;letter-spacing:1.5px}
  #start p{margin:0;color:var(--ink-dim);font-size:13px;max-width:420px;text-align:center;line-height:1.6}
  .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;max-width:520px}
  button{
    font:inherit;font-size:13px;color:var(--ink);cursor:pointer;
    background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.15);
    padding:10px 16px;border-radius:10px;transition:.18s;
  }
  button:hover{background:rgba(111,196,184,.16);border-color:var(--accent)}
  button.ghost{background:transparent;color:var(--ink-dim)}

  #toast{
    position:fixed;top:22px;left:50%;transform:translateX(-50%) translateY(-14px);
    background:var(--panel);border:1px solid rgba(255,255,255,.1);
    padding:9px 16px;border-radius:10px;font-size:12.5px;
    opacity:0;transition:.28s;pointer-events:none;z-index:30;max-width:70vw;
  }
  #toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  #toast.err{border-color:var(--bad);color:#f2c9c4}

  #title{
    position:fixed;top:20px;left:22px;font-size:12.5px;color:var(--ink-dim);
    letter-spacing:.4px;opacity:0;transition:opacity .5s;
  }
  #title.on{opacity:1}
  #title b{display:block;color:var(--ink);font-size:15px;font-weight:600;letter-spacing:.2px;margin-bottom:2px}

  #hint{
    position:fixed;bottom:74px;left:50%;transform:translateX(-50%);
    font-size:12px;color:var(--ink-dim);opacity:0;transition:opacity .6s;
    pointer-events:none;text-align:center;
  }
  #hint.on{opacity:1}

  /* ---- Phase 2/3 chrome (auth, browse, world, map) ---- */
  #authchip{ position:fixed; top:14px; right:16px; z-index:30; display:flex; gap:8px; align-items:center;
    font:13px/1 system-ui,sans-serif; color:var(--ink); }
  #authchip button{ background:#ffffff14; color:var(--ink); border:1px solid #ffffff2a; border-radius:8px;
    padding:6px 12px; cursor:pointer; font:inherit; }
  #authchip button:hover{ background:#ffffff24; }
  .overlay{ position:fixed; inset:0; z-index:20; background:#241f38ee; display:none;
    font:14px/1.5 system-ui,sans-serif; color:var(--ink); }
  .overlay.open{ display:block; }
  .overlay .head{ display:flex; justify-content:space-between; align-items:center; padding:18px 24px; }
  .overlay .head h2{ margin:0; font-weight:600; letter-spacing:.04em; }
  .overlay .close{ background:none; border:1px solid #ffffff2a; color:var(--ink); border-radius:8px;
    padding:6px 12px; cursor:pointer; }
  #browseList, #playsetList{ display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:12px; padding:0 24px 24px; }
  .pcard{ background:#ffffff10; border:1px solid #ffffff1c; border-radius:12px; padding:14px; cursor:pointer;
          text-align:left; font:inherit; color:var(--ink); width:100%; }
  .pcard:hover{ background:#ffffff1c; }
  .pcard b{ display:block; margin-bottom:4px; }
  .pcard small{ opacity:.65; }
  #worldWrap, #mapWrap{ position:fixed; inset:0; z-index:15; display:none; }
  #worldWrap canvas{ display:block; }
  #mapCanvas{ width:100%; height:100%; display:block; cursor:grab; }
  #worldHud{ position:fixed; left:16px; bottom:16px; z-index:16; font:13px/1.6 system-ui,sans-serif;
    color:var(--ink); background:#241f38cc; padding:10px 14px; border-radius:10px; display:none; }
</style>
</head>
<body>

<div id="stage"></div>
<div class="vignette"></div>
<div id="winflash"></div>

<div id="title"><b></b><span></span></div>
<div id="hint"></div>
<div id="toast"></div>

<div id="bar">
  <span class="mode" id="modeLabel">play</span>
  <span class="sep"></span>
  <div id="palette"></div>
  <span class="sep" id="palSep"></span>
  <div class="keys" id="keys"></div>
</div>

<div id="start">
  <h1>IMPOSSIBLE ARCHITECTURE</h1>
  <p>A courtyard that is quietly greener than when you arrived.<br>
     Walk with the arrow keys. Turn the world with Q and E.</p>
  <div class="row">
    <button id="btnPlay">▶ Play a maquette</button>
  </div>
  <div class="row">
    <button class="ghost" id="btnBuild">Build something</button>
    <button class="ghost" id="btnImport">Import .json</button>
    <button class="ghost" id="btnExport">Export .json</button>
  </div>
  <input type="file" id="fileIn" accept="application/json" style="display:none">
</div>




<div id="authchip"></div>

<div class="overlay" id="playset">
  <div class="head"><h2>Playset — 16 maquettes</h2><button class="close" data-close="playset">close</button></div>
  <div id="playsetList"></div>
</div>

<div class="overlay" id="browse">
  <div class="head"><h2>Published puzzles</h2><button class="close" data-close="browse">close</button></div>
  <div id="browseList"></div>
</div>

<div id="worldWrap"></div>
<canvas id="mapWrap"></canvas>
<div id="worldHud"></div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
