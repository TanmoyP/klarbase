title: "[Idea] "
body:
  - type: markdown
    attributes:
      value: Thanks for sharing! Ideas for isles, mechanics, themes or the site are all welcome here.
  - type: textarea
    id: idea
    attributes:
      label: The idea
    validations: { required: true }
  - type: textarea
    id: why
    attributes:
      label: Why would it make Klarbase better?
  - type: textarea
    id: extra
    attributes:
      label: Sketches, links or examples
